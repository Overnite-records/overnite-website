# Deploys the site to Firebase Hosting (overniterecords.com) on every push to main.
# No stored key: GitHub signs in to Google Cloud through Workload Identity Federation,
# and only pushes to main of this repo are allowed to use the deploy account.
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131314834359/locations/global/workloadIdentityPools/github/providers/overnite-website
          service_account: github-deploy@overnite-website.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y firebase-tools@latest deploy --only hosting --project overnite-website --non-interactive
